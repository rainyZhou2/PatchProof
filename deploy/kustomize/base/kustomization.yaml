apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: patchproof-system
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - api-deployment.yaml
  - api-service.yaml
  - controller-deployment.yaml
  - controller-service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: patchproof-config
    files:
      - config.yaml=config/patchproof.yaml
generatorOptions:
  disableNameSuffixHash: false
  labels:
    app.kubernetes.io/part-of: patchproof
