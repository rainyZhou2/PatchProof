apiVersion: v1
kind: Service
metadata:
  name: patchproof-api
  labels:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: patchproof
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
