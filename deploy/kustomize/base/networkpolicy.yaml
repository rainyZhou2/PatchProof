apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patchproof-default-deny
  labels:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/part-of: patchproof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patchproof-allow-dns
  labels:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/part-of: patchproof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patchproof-allow-ingress
  labels:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/part-of: patchproof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: patchproof
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patchproof-allow-egress
  labels:
    app.kubernetes.io/name: patchproof
    app.kubernetes.io/part-of: patchproof
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 8080
