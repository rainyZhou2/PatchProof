service:
  name: patchproof
  region: region-a
  version: 0.1.0
http:
  listenAddr: ":8080"
  externalUrl: ""
  readHeaderTimeout: 5s
  readTimeout: 30s
  writeTimeout: 60s
  idleTimeout: 120s
  shutdownTimeout: 20s
  maxBodyBytes: 2097152
database:
  driver: postgres
  maxConns: 20
  minConns: 2
  maxConnLifetime: 1h
  maxConnIdleTime: 15m
  statementTimeout: 30s
  migrateOnStart: false
events:
  driver: nats
  urls:
    - nats://nats.patchproof-system.svc.cluster.local:4222
  stream: PATCHPROOF
  consumerPrefix: patchproof
  maxAckPending: 512
  batchSize: 64
  ackWait: 30s
  outboxInterval: 500ms
  outboxBatch: 128
artifacts:
  driver: s3
  endpoint: ""
  region: region-a
  bucket: patchproof
  forcePathStyle: false
  presignTtl: 10m
auth:
  mode: dev
  devTenantId: 11111111-1111-4111-8111-111111111111
  devSubject: kustomize-dev
  devRoles:
    - admin
    - operator
    - viewer
    - platform-admin
  attemptTokenTtl: 30m
execution:
  defaultIsolation: untrusted-gvisor
  maxIsolation: untrusted-vm
  allowedLanguages: [go]
  runtimeClass: gvisor
  workerImage: ghcr.io/patchproof/patchproof-worker:0.1.0
  enforceTenantFloor: true
  allowFileRepositories: false
  allowFullFetch: false
  automountWorkerToken: false
  supportedIsolationTiers: [isolated-container, untrusted-gvisor]
  nodeSelector: {}
  tolerations: []
  namespace: patchproof-execution
  serviceAccount: patchproof-worker
  jobTtl: 30m
  jobBackoffLimit: 0
  activeDeadline: 20m
  maxConcurrent: 64
scheduler:
  shardCount: 16
  leaseTtl: 2m
  pollInterval: 1s
  batchSize: 64
  maxStepsPerTenant: 64
  maxStepsPerCluster: 256
  placement: score
telemetry:
  logLevel: info
  logFormat: json
  metricsAddr: ":9090"
  sampleRatio: 0.1
  serviceNamespace: patchproof
limits:
  maxRepositoryBytes: 2147483648
  maxChangedFiles: 2000
  maxStepCount: 64
  maxRunWallSeconds: 3600
  defaultWallSeconds: 900
  defaultCpuSeconds: 1200
  defaultFuzzCpuSeconds: 600
  maxParallelSteps: 64
  apiRpsPerTenant: 20
state:
  driver: postgres
