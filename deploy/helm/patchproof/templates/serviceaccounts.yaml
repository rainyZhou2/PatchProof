{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchproof.apiServiceAccountName" . }}
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.controller.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchproof.controllerServiceAccountName" . }}
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.clusterAgent.enabled .Values.clusterAgent.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "patchproof.clusterAgentServiceAccountName" . }}
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
  {{- with .Values.clusterAgent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and .Values.worker.serviceAccount.create .Values.execution.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.serviceAccount.name }}
  namespace: {{ .Values.execution.namespace }}
  labels:
    app.kubernetes.io/name: patchproof-worker
    app.kubernetes.io/part-of: patchproof
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.worker.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if and .Values.worker.brokerServiceAccount.create .Values.execution.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.worker.brokerServiceAccount.name }}
  namespace: {{ .Values.execution.namespace }}
  labels:
    app.kubernetes.io/name: patchproof-broker
    app.kubernetes.io/part-of: patchproof
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.worker.brokerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
