{{- if .Values.priorityClasses.enabled }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.critical.name }}
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.critical.value }}
globalDefault: false
description: PatchProof control-plane workloads.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.standard.name }}
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.standard.value }}
globalDefault: false
description: PatchProof standard workloads.
{{- end }}
