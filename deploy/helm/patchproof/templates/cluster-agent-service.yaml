{{- if .Values.clusterAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "patchproof.fullname" . }}-cluster-agent
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
  {{- with .Values.clusterAgent.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "patchproof.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
  ports:
    - name: agent
      port: {{ .Values.clusterAgent.service.port }}
      targetPort: agent
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "patchproof.fullname" . }}-cluster-agent
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
spec:
  minAvailable: {{ .Values.clusterAgent.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cluster-agent
{{- end }}
