{{- if .Values.controller.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "patchproof.fullname" . }}-controller
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "patchproof.fullname" . }}-controller
  minReplicas: {{ .Values.controller.hpa.minReplicas }}
  maxReplicas: {{ .Values.controller.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.controller.hpa.targetCPUUtilizationPercentage }}
{{- end }}
