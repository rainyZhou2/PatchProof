{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-default-deny
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-allow-dns
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.egress.dns.namespaceSelector | nindent 12 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-allow-api
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.api.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.metrics.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-allow-controller-metrics
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.metrics.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9090
{{- if .Values.clusterAgent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-allow-cluster-agent
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cluster-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.clusterAgent.namespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "patchproof.fullname" . }}-allow-egress
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: patchproof
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    {{- with .Values.networkPolicy.egress.postgres }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.nats }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.s3 }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.otlp }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.clusterAgent }}
    {{- if .cidrs }}
    - to:
        {{- range .cidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
    {{- end }}
{{- end }}
