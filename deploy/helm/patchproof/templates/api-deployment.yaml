apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchproof.fullname" . }}-api
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "patchproof.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: patchproof
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchproof.apiServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClasses.enabled }}
      priorityClassName: {{ .Values.priorityClasses.critical.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "patchproof.image" (dict "image" .Values.images.api "name" "api") }}
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          env:
            - name: PATCHPROOF_CONFIG
              value: /etc/patchproof/config.yaml
            - name: PATCHPROOF_ROLE
              value: api
            - name: PATCHPROOF_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: PATCHPROOF_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.dsnSecretRef.name is required" .Values.postgres.dsnSecretRef.name }}
                  key: {{ .Values.postgres.dsnSecretRef.key }}
            - name: PATCHPROOF_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "cas.s3.secretRef.name is required" .Values.cas.s3.secretRef.name }}
                  key: {{ .Values.cas.s3.secretRef.accessKeyKey }}
            - name: PATCHPROOF_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "cas.s3.secretRef.name is required" .Values.cas.s3.secretRef.name }}
                  key: {{ .Values.cas.s3.secretRef.secretKeyKey }}
            - name: PATCHPROOF_ATTEMPT_TOKEN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.attemptTokenKeySecretRef.name is required" .Values.auth.attemptTokenKeySecretRef.name }}
                  key: {{ .Values.auth.attemptTokenKeySecretRef.key }}
            {{- if .Values.auth.internalTokenSecretRef.name }}
            - name: PATCHPROOF_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.internalTokenSecretRef.name }}
                  key: {{ .Values.auth.internalTokenSecretRef.key }}
            {{- end }}
            {{- if .Values.auth.dev.enabled }}
            - name: PATCHPROOF_DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "auth.dev.tokenSecretRef.name is required" .Values.auth.dev.tokenSecretRef.name }}
                  key: {{ .Values.auth.dev.tokenSecretRef.key }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/patchproof
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "patchproof.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
      {{- if .Values.api.affinity }}
      affinity:
        {{- toYaml .Values.api.affinity | nindent 8 }}
      {{- else }}
      affinity:
        {{- include "patchproof.podAntiAffinity" (dict "root" . "component" "api") | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- include "patchproof.topologySpreadConstraints" (dict "root" . "component" "api" "constraints" .Values.api.topologySpreadConstraints) | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
