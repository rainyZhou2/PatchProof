{{- if .Values.clusterAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "patchproof.fullname" . }}-cluster-agent
  labels:
    {{- include "patchproof.labels" . | nindent 4 }}
    app.kubernetes.io/component: cluster-agent
spec:
  replicas: {{ .Values.clusterAgent.replicas }}
  selector:
    matchLabels:
      {{- include "patchproof.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cluster-agent
  template:
    metadata:
      labels:
        {{- include "patchproof.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cluster-agent
        app.kubernetes.io/part-of: patchproof
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.clusterAgent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "patchproof.clusterAgentServiceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClasses.enabled }}
      priorityClassName: {{ .Values.priorityClasses.critical.name }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: cluster-agent
          image: {{ include "patchproof.image" (dict "image" .Values.images.clusterAgent "name" "clusterAgent") }}
          imagePullPolicy: {{ .Values.images.clusterAgent.pullPolicy }}
          env:
            - name: PATCHPROOF_CONFIG
              value: /etc/patchproof/config.yaml
            - name: PATCHPROOF_ROLE
              value: cluster-agent
            - name: PATCHPROOF_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: PATCHPROOF_CLUSTER_ID
              value: {{ required "clusterId is required when clusterAgent.enabled=true" .Values.clusterId | quote }}
            - name: PATCHPROOF_CLUSTER_REGION
              value: {{ .Values.region | quote }}
            - name: PATCHPROOF_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "clusterAgent.tokenSecretRef.name is required" .Values.clusterAgent.tokenSecretRef.name }}
                  key: {{ .Values.clusterAgent.tokenSecretRef.key }}
            - name: PATCHPROOF_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ required "postgres.dsnSecretRef.name is required" .Values.postgres.dsnSecretRef.name }}
                  key: {{ .Values.postgres.dsnSecretRef.key }}
            - name: PATCHPROOF_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "cas.s3.secretRef.name is required" .Values.cas.s3.secretRef.name }}
                  key: {{ .Values.cas.s3.secretRef.accessKeyKey }}
            - name: PATCHPROOF_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "cas.s3.secretRef.name is required" .Values.cas.s3.secretRef.name }}
                  key: {{ .Values.cas.s3.secretRef.secretKeyKey }}
          ports:
            - name: agent
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: agent
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: agent
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.clusterAgent.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/patchproof
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ include "patchproof.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
      {{- if .Values.clusterAgent.affinity }}
      affinity:
        {{- toYaml .Values.clusterAgent.affinity | nindent 8 }}
      {{- else }}
      affinity:
        {{- include "patchproof.podAntiAffinity" (dict "root" . "component" "cluster-agent") | nindent 8 }}
      {{- end }}
      {{- with .Values.clusterAgent.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clusterAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
