// Verification plugin contract.
//
// This file is the protocol contract only; generated bindings are produced by
// `make generate` and are not checked in.
//
// Execution is at-least-once. A plugin may receive Execute more than once for
// the same attempt and must return the same result digest for identical inputs,
// or fail with a retryable error. Every request carries fencing_generation;
// results for a generation older than the plugin's last accepted generation for
// that attempt must be rejected with ERROR_CODE_LEASE_EXPIRED. Cancellation is
// best effort and does not imply that side effects were rolled back.
syntax = "proto3";

package patchproof.plugin.v1;

option go_package = "github.com/patchproof/patchproof/api/proto/gen/patchproof/plugin/v1;pluginv1";

// CasRef identifies an immutable object in tenant-scoped content-addressed
// storage. Plugins must verify the digest before using the object.
message CasRef {
  // Digest algorithm. Only "sha256" is currently defined.
  string algorithm = 1;
  // Lowercase hex digest, with or without the "sha256:" prefix.
  string digest = 2;
  int64 size_bytes = 3;
  // Trust domain; empty means the tenant of the request.
  string tenant_scope = 4;
}

// Capabilities is returned during the handshake. Protocol major versions are
// incompatible when they differ; minor versions are additive.
message Capabilities {
  string plugin_id = 1;
  string version = 2;
  uint32 protocol_major = 3;
  uint32 protocol_minor = 4;
  repeated string languages = 5;
  repeated string step_kinds = 6;
  repeated string architectures = 7;
  repeated string isolation_tiers = 8;
  repeated string artifact_transports = 9;
  repeated string features = 10;
}

message GetCapabilitiesRequest {}

message InputBinding {
  CasRef ref = 1;
  // "file", "tar.gz" or "tar.zst".
  string kind = 2;
  // Relative path inside the workspace; absolute paths and ".." are rejected.
  string path = 3;
}

message StepRequest {
  string run_id = 1;
  string step_id = 2;
  string tenant_id = 3;
  string attempt_id = 4;
  // Monotonic fence for the attempt. The plugin must reject older generations.
  uint64 fencing_generation = 5;
  string policy_digest = 6;
  string kind = 7;
  string language = 8;
  string engine = 9;
  repeated CasRef inputs = 10;
  map<string, InputBinding> named_inputs = 11;
  // Options already validated against the step-kind schema.
  bytes validated_options_json = 12;
  int64 deadline_unix_ms = 13;
  uint32 protocol_major = 14;
  uint32 protocol_minor = 15;
}

enum StepOutcome {
  STEP_OUTCOME_UNSPECIFIED = 0;
  STEP_OUTCOME_SUCCEEDED = 1;
  STEP_OUTCOME_FAILED = 2;
  STEP_OUTCOME_RETRYABLE = 3;
  STEP_OUTCOME_CANCELLED = 4;
  STEP_OUTCOME_TIMED_OUT = 5;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_COMPILATION_FAILED = 1;
  ERROR_CODE_TEST_ASSERTION_FAILED = 2;
  ERROR_CODE_COUNTEREXAMPLE_FOUND = 3;
  ERROR_CODE_ENGINE_UNSUPPORTED = 4;
  ERROR_CODE_SOLVER_TIMEOUT = 5;
  ERROR_CODE_ENGINE_CRASH = 6;
  ERROR_CODE_NODE_LOST = 7;
  ERROR_CODE_POD_EVICTED = 8;
  ERROR_CODE_IMAGE_PULL_FAILED = 9;
  ERROR_CODE_CAS_5XX = 10;
  ERROR_CODE_CAS_DIGEST_MISMATCH = 11;
  ERROR_CODE_POLICY_TAMPERED = 12;
  ERROR_CODE_LEASE_EXPIRED = 13;
  ERROR_CODE_TENANT_QUOTA_EXCEEDED = 14;
  ERROR_CODE_VALIDATION_FAILED = 15;
  ERROR_CODE_DEPENDENCY_FAILED = 16;
  ERROR_CODE_EXECUTOR_ERROR = 17;
  ERROR_CODE_WORKER_LOST = 18;
  ERROR_CODE_UPLOAD_FAILED = 19;
  ERROR_CODE_SANDBOX_UNAVAILABLE = 20;
  ERROR_CODE_TIMEOUT = 21;
  ERROR_CODE_CANCELLED = 22;
  ERROR_CODE_POLICY_BLOCKED = 23;
  ERROR_CODE_AUTHZ_DENIED = 24;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
  bool retryable = 3;
  map<string, string> details = 4;
}

message StepMetrics {
  double cpu_seconds = 1;
  double memory_gib_seconds = 2;
  double ephemeral_disk_gib_seconds = 3;
  int64 egress_bytes = 4;
  int64 cas_written_bytes = 5;
  int64 queue_wait_ms = 6;
  int64 execution_ms = 7;
  int64 upload_ms = 8;
}

message StepResponse {
  string attempt_id = 1;
  // Must equal the request generation. Stale results are discarded.
  uint64 fencing_generation = 2;
  StepOutcome outcome = 3;
  Error error = 4;
  repeated CasRef artifacts = 5;
  CasRef evidence_envelope = 6;
  // Serialized StepResult for fields not modeled by this contract.
  bytes result_json = 7;
  StepMetrics metrics = 8;
}

message CancelRequest {
  string attempt_id = 1;
  uint64 fencing_generation = 2;
  string reason = 3;
}

message Progress {
  string attempt_id = 1;
  uint64 fencing_generation = 2;
  // Short phase label, for example "compile" or "fuzz".
  string phase = 3;
  // 0-100; negative when progress is not measurable.
  int32 percent = 4;
  string message = 5;
  int64 at_unix_ms = 6;
}

message StreamProgressRequest {
  string attempt_id = 1;
  uint64 fencing_generation = 2;
}

message Ack {
  string attempt_id = 1;
  bool accepted = 2;
  string message = 3;
}

service VerificationPlugin {
  rpc GetCapabilities(GetCapabilitiesRequest) returns (Capabilities);
  rpc Execute(StepRequest) returns (StepResponse);
  rpc Cancel(CancelRequest) returns (Ack);
  rpc StreamProgress(StreamProgressRequest) returns (stream Progress);
}
