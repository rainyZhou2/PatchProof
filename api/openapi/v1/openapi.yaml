          format: int64
          minimum: 1
        memory_mib:
          type: integer
          format: int64
          minimum: 1
        ephemeral_disk_gib:
          type: integer
          format: int64
          minimum: 0
        network:
          $ref: "#/components/schemas/NetworkMode"
        subject_network:
          anyOf:
            - $ref: "#/components/schemas/NetworkMode"
