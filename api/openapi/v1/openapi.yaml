    TenantQuota:
      type: object
      additionalProperties: false
      properties:
        max_concurrent_runs:
          type: integer
          minimum: 0
        max_concurrent_steps:
          type: integer
          minimum: 0
        cpu_core_seconds_per_day:
          type: number
          minimum: 0
        fuzz_seconds_per_day:
          type: number
          minimum: 0
        storage_bytes:
          type: integer
          format: int64
          minimum: 0
        api_rps:
          type: integer
          minimum: 0

    CreateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        home_region:
          type: string
          description: Defaults to the region of the control plane.
        security_tier:
          $ref: "#/components/schemas/SecurityTier"
        display_name:
          type: string
        quota:
          $ref: "#/components/schemas/TenantQuota"

    Tenant:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - home_region
        - security_tier
        - status
        - active_writer_epoch
        - quota
        - display_name
        - created_at
        - updated_at
      properties:
        tenant_id:
          type: string
          format: uuid
        home_region:
          type: string
        security_tier:
          $ref: "#/components/schemas/SecurityTier"
        status:
          $ref: "#/components/schemas/TenantStatus"
        active_writer_epoch:
          type: integer
          format: int64
          minimum: 0
        quota:
          $ref: "#/components/schemas/TenantQuota"
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
