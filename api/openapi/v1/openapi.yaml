        deadline_seconds:
          type: integer
          minimum: 1
        preemptible:
          type: boolean
        gpu_count:
          type: integer
          minimum: 0
        runtime_class:
          type: string
        artifact_transport:
          anyOf:
            - $ref: "#/components/schemas/ArtifactTransport"
            - const: ""
        image_digest:
          type: string
        required_features:
          type: array
          items:
            type: string

    Step:
      type: object
      additionalProperties: false
      required:
        - step_id
