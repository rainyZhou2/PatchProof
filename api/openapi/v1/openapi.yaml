      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/Run"
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.

    ResourceRequirements:
      type: object
      additionalProperties: false
      required:
