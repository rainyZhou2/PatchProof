        run_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[a-z0-9][a-z0-9:._-]{0,127}$"
        kind:
          $ref: "#/components/schemas/StepKind"
        status:
          $ref: "#/components/schemas/StepStatus"
        generation:
          type: integer
          format: int64
          minimum: 0
        attempt_count:
          type: integer
          minimum: 0
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
        current_attempt_id:
          type: string
          format: uuid
        lease_owner:
          type: string
        lease_deadline:
          type: [string, "null"]
          format: date-time
        target_cluster:
          type: string
        requirements:
          $ref: "#/components/schemas/ResourceRequirements"
        input_manifest_digest:
          type: string
        result_digest:
          type: string
        output_manifest:
          type: string
        failure_class:
          $ref: "#/components/schemas/ErrorClass"
        failure_message:
          type: string
        next_attempt_at:
          type: [string, "null"]
          format: date-time
        priority:
          type: integer
        shard:
          type: integer
          minimum: 0
        options:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    Claim:
      type: object
      additionalProperties: false
      required:
        - claim_id
        - run_id
        - tenant_id
        - contract_id
        - kind
        - title
        - predicate
        - domain
        - observable
        - language
        - required
        - minimum_result
        - created_at
      properties:
        claim_id:
